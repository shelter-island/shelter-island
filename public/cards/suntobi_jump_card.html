<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=720, initial-scale=1" />
    <title>サントビ・ジャン Character Card</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 720px;
        min-height: 1280px;
        overflow: hidden;
        background: #050505;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans",
          "Yu Gothic", "YuGothic", sans-serif;
      }

      .card {
        position: relative;
        width: 720px;
        height: 1280px;
        overflow: hidden;
        color: #fff6de;
        background:
          radial-gradient(circle at 70% 18%, rgba(255, 194, 67, 0.24), transparent 23%),
          radial-gradient(circle at 18% 42%, rgba(0, 189, 185, 0.18), transparent 24%),
          linear-gradient(170deg, #050505 0%, #11100e 48%, #050505 100%);
      }

      .card::before {
        position: absolute;
        inset: 22px;
        z-index: 4;
        pointer-events: none;
        content: "";
        border: 2px solid rgba(255, 210, 93, 0.7);
        border-radius: 28px;
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.08),
          0 0 42px rgba(255, 180, 46, 0.2);
      }

      .speed-line {
        position: absolute;
        width: 360px;
        height: 12px;
        border-radius: 999px;
        background: linear-gradient(90deg, transparent, rgba(255, 72, 37, 0.92), transparent);
        transform: rotate(-23deg);
        opacity: 0.75;
      }

      .line-1 {
        top: 194px;
        left: -44px;
      }

      .line-2 {
        top: 256px;
        right: -80px;
        background: linear-gradient(90deg, transparent, rgba(20, 219, 204, 0.78), transparent);
      }

      .line-3 {
        top: 785px;
        left: -104px;
        width: 460px;
      }

      .sun-ring {
        position: absolute;
        top: 74px;
        right: 52px;
        width: 186px;
        height: 186px;
        border: 16px solid rgba(255, 193, 51, 0.18);
        border-radius: 50%;
        box-shadow: 0 0 80px rgba(255, 182, 40, 0.28);
      }

      .hero {
        position: absolute;
        z-index: 2;
        top: 96px;
        left: -88px;
        width: 892px;
        filter: drop-shadow(0 28px 34px rgba(0, 0, 0, 0.92))
          drop-shadow(0 0 18px rgba(255, 185, 42, 0.22));
      }

      .top {
        position: absolute;
        z-index: 5;
        top: 48px;
        left: 54px;
        right: 54px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }

      .crew {
        font-size: 21px;
        font-weight: 900;
        letter-spacing: 0;
        color: #ffe28e;
      }

      .serial {
        min-width: 124px;
        padding: 9px 14px;
        border: 1px solid rgba(255, 226, 142, 0.62);
        border-radius: 999px;
        color: #ffe28e;
        font-size: 18px;
        font-weight: 800;
        text-align: center;
        background: rgba(5, 5, 5, 0.64);
      }

      .name-block {
        position: absolute;
        z-index: 5;
        left: 54px;
        right: 54px;
        bottom: 276px;
      }

      .label {
        display: inline-flex;
        align-items: center;
        height: 34px;
        padding: 0 13px;
        border-radius: 999px;
        color: #071111;
        font-size: 16px;
        font-weight: 900;
        background: #17d7cb;
      }

      h1 {
        margin: 14px 0 4px;
        color: #fff3cb;
        font-size: 64px;
        line-height: 0.98;
        font-weight: 1000;
        letter-spacing: 0;
        text-shadow:
          0 4px 0 rgba(255, 73, 38, 0.54),
          0 12px 28px rgba(0, 0, 0, 0.78);
      }

      .roman {
        margin: 0;
        color: #ffcc42;
        font-size: 21px;
        font-weight: 900;
        letter-spacing: 0;
      }

      .info {
        position: absolute;
        z-index: 5;
        left: 54px;
        right: 54px;
        bottom: 62px;
        display: grid;
        grid-template-columns: 204px 1fr;
        gap: 18px;
      }

      .birthday,
      .profile {
        min-height: 176px;
        border: 1px solid rgba(255, 226, 142, 0.56);
        border-radius: 22px;
        background: rgba(5, 5, 5, 0.76);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.46);
        backdrop-filter: blur(10px);
      }

      .birthday {
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 20px;
      }

      .mini {
        color: #17d7cb;
        font-size: 15px;
        font-weight: 900;
      }

      .date {
        margin-top: 6px;
        color: #fff3cb;
        font-size: 52px;
        line-height: 1;
        font-weight: 1000;
      }

      .goro {
        margin-top: 12px;
        color: #ffcc42;
        font-size: 15px;
        font-weight: 800;
        line-height: 1.35;
      }

      .profile {
        padding: 22px 22px 18px;
      }

      .copy {
        margin: 0;
        color: #fff7e8;
        font-size: 23px;
        line-height: 1.42;
        font-weight: 850;
      }

      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 16px;
      }

      .tag {
        padding: 7px 10px;
        border-radius: 999px;
        color: #071111;
        font-size: 13px;
        font-weight: 1000;
        background: #ffcc42;
      }

      .tag:nth-child(2) {
        background: #ff4f2d;
        color: #fff7e8;
      }

      .tag:nth-child(3) {
        background: #17d7cb;
      }

      .deck {
        position: absolute;
        right: -120px;
        bottom: 212px;
        z-index: 1;
        width: 520px;
        height: 18px;
        border-radius: 999px;
        background: linear-gradient(90deg, transparent, rgba(255, 202, 76, 0.62), transparent);
        transform: rotate(-19deg);
        filter: blur(1px);
      }
    </style>
  </head>
  <body>
    <main class="card" aria-label="サントビ・ジャンのキャラクターカード">
      <div class="sun-ring"></div>
      <div class="speed-line line-1"></div>
      <div class="speed-line line-2"></div>
      <div class="speed-line line-3"></div>
      <div class="deck"></div>

      <section class="top">
        <div class="crew">NO LIMIT CREW ISLAND</div>
        <div class="serial">AIR-0310</div>
      </section>

      <img
        class="hero"
        src="../images/characters/iphone_720x1280/suntobi_jump_source.webp"
        alt="スケートボードでジャンプするサントビ・ジャン"
      />

      <section class="name-block">
        <div class="label">HANGOUT SPOT / NO LIMIT</div>
        <h1>サントビ・ジャン</h1>
        <p class="roman">SUNTOVI JUMP</p>
      </section>

      <section class="info">
        <div class="birthday">
          <div class="mini">BIRTHDAY</div>
          <div class="date">3.10</div>
          <div class="goro">SUN = 3<br />トビの「ト」 = 10</div>
        </div>
        <div class="profile">
          <p class="copy">
            空まで跳ぶ勢いで、失敗ごと笑い飛ばすスケートキッド。
          </p>
          <div class="tags">
            <span class="tag">JUMP</span>
            <span class="tag">SKATE</span>
            <span class="tag">SUN</span>
            <span class="tag">HELMET</span>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
