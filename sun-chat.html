<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="THE SUNと短く話しながら、一緒に考えるためのチャットページです。"
    />
    <title>THE SUN CHAT v0.1</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./sun-chat.css" />
    <script type="module" src="./sun-chat.js"></script>
  </head>
  <body>
    <main class="chat-page" aria-label="THE SUN CHAT">
      <section class="sun-intro" aria-labelledby="chatTitle">
        <div class="sun-mark">THE SUN / v0.1</div>
        <figure class="sun-portrait">
          <img
            src="./images/the-sun/character.png"
            alt="THE SUNのキャラクター"
            width="1024"
            height="1536"
            decoding="async"
            fetchpriority="high"
          />
        </figure>
        <div class="intro-copy">
          <p class="kicker">SUN SIDE / MOON SIDE</p>
          <h1 id="chatTitle">なんか話す？</h1>
          <p>答えを急がず、ちょっと横から一緒に見る。</p>
        </div>
      </section>

      <section class="chat-shell" aria-label="会話">
        <div class="messages" id="messages" aria-live="polite"></div>
        <form class="composer" id="chatForm">
          <label class="visually-hidden" for="chatInput">THE SUNに話す</label>
          <textarea
            id="chatInput"
            name="message"
            rows="2"
            maxlength="800"
            placeholder="今考えていることを書く"
            autocomplete="off"
          ></textarea>
          <button type="submit">送信</button>
        </form>
      </section>
    </main>
  </body>
</html>
